[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-tool"
version = "0.2.0"
description = "A comprehensive PDF manipulation tool"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "Your Name", email = "you@example.com" }
]
dependencies = [
    "pyside6",
    "pymupdf"
]

[project.scripts]
pdf-tool = "pdf_tool.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
